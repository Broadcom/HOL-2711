apiVersion: v1
kind: Namespace
metadata:
  name: hol-wordpress
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Secret
metadata:
  name: wordpress-db-credentials
  namespace: hol-wordpress
stringData:
  database: wordpress
  username: wordpress
  password: '<WORDPRESS_DB_PASSWORD>'
  rootpassword: '<MARIADB_ROOT_PASSWORD>'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: hol-wordpress
spec:
  replicas: 1
  selector:
    matchLabels: {app: mariadb}
  template:
    metadata:
      labels: {app: mariadb}
    spec:
      containers:
        - name: mariadb
          image: depot.kube-system.svc/hol/mariadb:latest
          env:
            - {name: MARIADB_DATABASE,      valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: database}}}
            - {name: MARIADB_USER,          valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: username}}}
            - {name: MARIADB_PASSWORD,      valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: password}}}
            - {name: MARIADB_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: rootpassword}}}
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: hol-wordpress
spec:
  selector: {app: mariadb}
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: hol-wordpress
spec:
  replicas: 1
  selector:
    matchLabels: {app: wordpress}
  template:
    metadata:
      labels: {app: wordpress}
    spec:
      containers:
        - name: wordpress
          image: depot.kube-system.svc/hol/wordpress:latest
          env:
            - {name: WORDPRESS_DB_HOST,     value: "mariadb:3306"}
            - {name: WORDPRESS_DB_NAME,     valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: database}}}
            - {name: WORDPRESS_DB_USER,     valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: username}}}
            - {name: WORDPRESS_DB_PASSWORD, valueFrom: {secretKeyRef: {name: wordpress-db-credentials, key: password}}}
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: hol-wordpress
spec:
  type: LoadBalancer
  selector: {app: wordpress}
  ports:
    - port: 80
      targetPort: 80
