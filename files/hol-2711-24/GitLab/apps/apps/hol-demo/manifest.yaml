apiVersion: v1
kind: Namespace
metadata:
  name: hol-demo
  labels:
    # VKS guest clusters enforce Pod Security "restricted" by default, which
    # rejects stock images that run as root. "baseline" still blocks the
    # genuinely dangerous things (privileged, hostNetwork, hostPath) while
    # allowing an unmodified upstream image to run. Prefer this over
    # "privileged", which turns the admission controller off entirely.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hol-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          # depot.kube-system.svc, not the Harbor IP: guest cluster nodes only
          # trust the registry under that hostname.
          image: depot.kube-system.svc/hol/nginx:alpine
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # Drop everything, then add back only what stock nginx actually
              # needs. Dropping ALL on its own crashes it at startup with
              #   chown("/var/cache/nginx/client_temp") failed (not permitted)
              # because the master process chowns its cache dirs and drops to
              # the nginx user for workers.
              drop: ["ALL"]
              add:
                - CHOWN             # chown the cache directories
                - SETUID            # drop workers to the nginx user
                - SETGID            # and its group
                - NET_BIND_SERVICE  # bind port 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: hol-demo
spec:
  type: LoadBalancer
  selector: {app: web}
  ports:
    - port: 80
      targetPort: 80
