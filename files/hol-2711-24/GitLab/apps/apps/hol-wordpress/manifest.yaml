apiVersion: v1
kind: Namespace
metadata:
  name: hol-wordpress
  labels:
    # Same reason as apps/hol-demo: VKS guest clusters enforce Pod Security
    # "restricted" by default and the stock WordPress image starts as root.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: hol-wordpress
spec:
  replicas: 2
  selector:
    matchLabels: {app: wordpress}
  template:
    metadata:
      labels: {app: wordpress}
    spec:
      containers:
        - name: wordpress
          image: depot.kube-system.svc/hol/wordpress:latest
          ports:
            - containerPort: 80
          # Every value comes from a Secret that the PIPELINE puts in this
          # namespace, not from this file. That is deliberate: this repo is the
          # source of truth for what the application IS, and it is world
          # readable to everyone with access to git. The database password is
          # generated by demo/hol-data and never leaves the platform.
          #
          # The secret is named hol-db-credentials in both places because the
          # seed stage copies it verbatim out of the supervisor namespace.
          env:
            - name: WORDPRESS_DB_HOST
              valueFrom:
                secretKeyRef: {name: hol-db-credentials, key: host}
            - name: WORDPRESS_DB_NAME
              valueFrom:
                secretKeyRef: {name: hol-db-credentials, key: database}
            - name: WORDPRESS_DB_USER
              valueFrom:
                secretKeyRef: {name: hol-db-credentials, key: username}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: hol-db-credentials, key: password}
          # WordPress generates these eight values at container start if they
          # are not supplied, so each replica ends up with its OWN cookie
          # secrets and a session issued by one pod is rejected by the other.
          # The visible symptom is a login that succeeds and then bounces back
          # to the login form on the next click, depending on which replica the
          # load balancer happened to pick. Same secret on every pod fixes it.
          envFrom:
            - secretRef: {name: hol-wp-salts}
              prefix: WORDPRESS_
          # The pod's Harbor WordPress image (4.8.3) predates the official
          # image's WORDPRESS_CONFIG_EXTRA support, so the URL fix is
          # written into wp-config.php directly, once the entrypoint has
          # generated it. WP_HOME/WP_SITEURL from the request host make
          # the site serve correctly at any load balancer address,
          # including after a destroy and rebuild, and cover the
          # localhost case.
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - -c
                  - |
                    f=/var/www/html/wp-config.php
                    for i in $(seq 1 120); do
                      [ -s "$f" ] && break
                      sleep 1
                    done
                    sleep 1
                    grep -q "WP_SITEURL" "$f" 2>/dev/null && exit 0
                    sed -i "s|^<?php|<?php\ndefine('WP_HOME','http://'.\$_SERVER['HTTP_HOST']);\ndefine('WP_SITEURL','http://'.\$_SERVER['HTTP_HOST']);|" "$f"
                    exit 0
          readinessProbe:
            httpGet: {path: /, port: 80}
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-lb
  namespace: hol-wordpress
spec:
  type: LoadBalancer
  selector: {app: wordpress}
  ports:
    - port: 80
      targetPort: 80
