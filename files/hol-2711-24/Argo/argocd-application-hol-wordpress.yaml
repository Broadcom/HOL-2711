apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hol-wordpress
  namespace: REPLACE-WITH-ELW-NAMESPACE
spec:
  project: default
  source:
    repoURL: https://gitlab.vcf.lab/hol-gitops/apps.git
    targetRevision: main
    path: apps/hol-wordpress
  destination:
    name: tf-workload
    namespace: hol-wordpress
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 3m
