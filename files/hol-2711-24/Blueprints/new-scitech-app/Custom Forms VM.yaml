formatVersion: 2
name: Custom Forms VM
description: Deploy a single Linux VM whose name and size are asked for on the request form
inputs:
  hostname:
    type: string
    title: Hostname
    # Deliberately unconstrained here. The regular expression, the length
    # bounds and the validation message are added in the form designer,
    # which is what the module teaches. The composed object name below is
    # an RFC 1123 name, so lowercase alphanumeric is what the form's
    # regular expression has to enforce; a to_lower() transform was
    # considered and left out so the student sees the constraint work
    # rather than a silent correction. A 15 character maximum in the form
    # keeps the composed name inside the 63 character object name limit.
  className:
    type: string
    title: VM Class
    enum:
      - best-effort-small
      - best-effort-medium
    default: best-effort-small
outputs:
  sshCommand:
    value: ssh holuser@${resource.LoadBalancer.object.status.loadBalancer.ingress[0].ip}
  loadBalancerIp:
    value: ${resource.LoadBalancer.object.status.loadBalancer.ingress[0].ip}
  __deploymentOverview:
    value: |-
      ## Linux VM named from the request form

      A VM Service virtual machine was created in the supervisor namespace and
      published through a load balancer on port 22.

      **Connect:**

      ```
      ssh holuser@${resource.LoadBalancer.object.status.loadBalancer.ingress[0].ip}
      ```

      * VM: `${input.hostname}-${env.shortDeploymentId}`
      * VM class: `${input.className}`
      * Load balancer: `vm-lb-${input.hostname}-${env.shortDeploymentId}`
      * Image: `ubuntu-24-04-gold-ovf`
      * Login: `holuser` / the HOL standard password (baked into the image)
resources:
  CCI_Supervisor_Namespace_1:
    type: CCI.Supervisor.Namespace
    properties:
      name: ns-new-scitech-app-7hmlb
      existing: true
  Virtual_Machine_1:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachine
        metadata:
          name: ${input.hostname}-${env.shortDeploymentId}
          labels:
            vm-selector: hol-custom-forms-vm
            vm-lb: vm-lb-${input.hostname}-${env.shortDeploymentId}
        spec:
          className: ${input.className}
          imageName: ubuntu-24-04-gold-ovf
          powerState: PoweredOn
          storageClass: vsan-default-storage-policy
      wait:
        conditions:
          - type: VirtualMachineCreated
            status: 'True'
  LoadBalancer:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.CCI_Supervisor_Namespace_1.id}
      manifest:
        apiVersion: vmoperator.vmware.com/v1alpha3
        kind: VirtualMachineService
        metadata:
          name: vm-lb-${input.hostname}-${env.shortDeploymentId}
        spec:
          selector:
            vm-lb: vm-lb-${input.hostname}-${env.shortDeploymentId}
          type: LoadBalancer
          ports:
            - name: ssh
              protocol: TCP
              port: 22
              targetPort: 22
