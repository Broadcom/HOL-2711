formatVersion: 2
name: Container Based WordPress
description: Deploy WordPress and its database as vSphere Pods, published on a load balancer
outputs:
  __deploymentOverview:
    value: |-
      ## WordPress + MariaDB (vSphere Pods)

      A two-tier application running as vSphere Pods:

      * **wordpress** web tier, published on a load balancer (port 80)
      * **wordpress-db** MariaDB tier, reachable only inside the namespace
      * The database password was **generated by this deployment**, not
        hardcoded in the blueprint
      * Both images came from the lab registry (Harbor)

      **Find your site:** on the Services page look for the service named

      ```
      app-lb-${input.appname}-${env.shortDeploymentId}
      ```

      and browse its **External IP** on port 80. Each deployment gets its own
      uniquely named service and its own IP, so match the name exactly.
      The database service is `${input.appname}-db-${env.shortDeploymentId}`
      (ClusterIP, reachable only inside the namespace).
inputs:
  appname:
    type: string
    default: wordpress
resources:
  SupervisorNamespace:
    type: CCI.Supervisor.Namespace
    metadata:
      layoutPosition:
        - 1
        - 0
    properties:
      name: ns-new-scitech-app-7hmlb
      existing: true
  mariadbDeployment:
    type: CCI.Supervisor.Resource
    metadata:
      layoutPosition:
        - 2
        - 2
    properties:
      context: ${resource.SupervisorNamespace.id}
      manifest:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${input.appname}-db-${env.shortDeploymentId}
          labels:
            app: ${input.appname}-db-${env.shortDeploymentId}
        spec:
          selector:
            matchLabels:
              app: ${input.appname}-db-${env.shortDeploymentId}
          template:
            metadata:
              labels:
                app: ${input.appname}-db-${env.shortDeploymentId}
            spec:
              containers:
                - image: depot.kube-system.svc/hol/mariadb:latest
                  name: mariadb
                  env:
                    - name: MARIADB_ROOT_PASSWORD
                      value: ${resource.dbPassword.generatedPassword}
                    - name: MARIADB_DATABASE
                      value: wordpress
                    - name: MARIADB_USER
                      value: wordpress
                    - name: MARIADB_PASSWORD
                      value: ${resource.dbPassword.generatedPassword}
                  ports:
                    - containerPort: 3306
  mariadbService:
    type: CCI.Supervisor.Resource
    metadata:
      layoutPosition:
        - 2
        - 3
    properties:
      context: ${resource.SupervisorNamespace.id}
      manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${input.appname}-db-${env.shortDeploymentId}
        spec:
          selector:
            app: ${input.appname}-db-${env.shortDeploymentId}
          ports:
            - port: 3306
              targetPort: 3306
  wordpressDeployment:
    type: CCI.Supervisor.Resource
    metadata:
      layoutPosition:
        - 2
        - 1
    properties:
      context: ${resource.SupervisorNamespace.id}
      manifest:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${input.appname}-${env.shortDeploymentId}
          labels:
            app: ${input.appname}-${env.shortDeploymentId}
        spec:
          selector:
            matchLabels:
              app: ${input.appname}-${env.shortDeploymentId}
          template:
            metadata:
              labels:
                app: ${input.appname}-${env.shortDeploymentId}
            spec:
              containers:
                - image: depot.kube-system.svc/hol/wordpress:latest
                  name: wordpress
                  env:
                    - name: WORDPRESS_DB_HOST
                      value: ${input.appname}-db-${env.shortDeploymentId}
                    - name: WORDPRESS_DB_NAME
                      value: wordpress
                    - name: WORDPRESS_DB_USER
                      value: wordpress
                    - name: WORDPRESS_DB_PASSWORD
                      value: ${resource.dbPassword.generatedPassword}
                  ports:
                    - containerPort: 80
  wordpressLB:
    type: CCI.Supervisor.Resource
    metadata:
      layoutPosition:
        - 1
        - 2
    properties:
      context: ${resource.SupervisorNamespace.id}
      manifest:
        apiVersion: v1
        kind: Service
        metadata:
          name: app-lb-${input.appname}-${env.shortDeploymentId}
        spec:
          selector:
            app: ${input.appname}-${env.shortDeploymentId}
          type: LoadBalancer
          ports:
            - port: 80
              targetPort: 80
  dbPassword:
    type: Util.PasswordEntry
    metadata:
      layoutPosition: []
    properties:
      length: 16
