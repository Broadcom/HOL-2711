formatVersion: 2
name: VKS Guest Cluster with WordPress
description: Deploy a VKS cluster and a working WordPress site inside it, in one deployment
version: 1
metadata:
  deploymentSettings:
    hideDisabledDay2Actions: true
outputs:
  controlPlaneEndpoint:
    value: ${resource.CLUSTER.object.spec.controlPlaneEndpoint.host}:${resource.CLUSTER.object.spec.controlPlaneEndpoint.port}
  clusterName:
    value: ${resource.CLUSTER.object.metadata.name}
  __deploymentOverview:
    value: |-
      ## WordPress on a VKS Cluster

      A VKS Kubernetes cluster was created and WordPress (with MariaDB) was
      deployed inside it, fronted by a load balancer.

      * Cluster: `${resource.CLUSTER.object.metadata.name}`
      * Namespace: `${input.namespace}`
      * Control plane API: `https://${resource.CLUSTER.object.spec.controlPlaneEndpoint.host}:${resource.CLUSTER.object.spec.controlPlaneEndpoint.port}`

      **Connect to the cluster** (the `kubectl-vsphere` plugin is deprecated
      and is not installed on the console; use the VCF CLI):

      ```
      vcf context create gc --endpoint 10.1.8.132 \
        --insecure-skip-tls-verify --type k8s --auth-type basic \
        --username administrator@wld.sso \
        --workload-cluster-name ${resource.CLUSTER.object.metadata.name} \
        --workload-cluster-namespace ${input.namespace}

      vcf context use gc:${resource.CLUSTER.object.metadata.name}
      kubectl get nodes
      ```

      **Find the WordPress site.** Its load balancer lives INSIDE the guest
      cluster, so VCF Automation cannot show its IP here. Read it from the
      cluster:

      ```
      kubectl -n wordpress get svc wordpress-lb
      ```

      Browse the EXTERNAL-IP on port 80. Sign in at `/wp-admin` as `admin`
      with the password generated by this deployment (see the Resources tab).
inputs:
  namespace:
    type: string
    title: Namespace
    $data: /data/namespaces
  vks_name:
    type: string
    title: VKS Cluster Name
    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
    # 48 not 63: a per-deployment suffix is appended to keep the cluster name
    # unique, and the resulting object name must still fit in 63 characters.
    maxLength: 48
    minLength: 1
    default: hol-vks-wp
  workerCount:
    type: integer
    title: Worker Node Count
    default: 1
    enum: [1, 2, 3]
  siteTitle:
    type: string
    title: Site Title
    default: HOL SciTech Store
resources:
  cciNamespace:
    type: CCI.Supervisor.Namespace
    properties:
      name: ${input.namespace}
      existing: true
  CLUSTER:
    type: CCI.Supervisor.Resource
    properties:
      context: ${resource.cciNamespace.id}
      manifest:
        apiVersion: cluster.x-k8s.io/v1beta1
        kind: Cluster
        metadata:
          name: ${to_lower(input.vks_name)}-${env.shortDeploymentId}
        spec:
          clusterNetwork:
            pods:
              cidrBlocks: ['192.168.156.0/20']
            services:
              cidrBlocks: ['10.96.0.0/12']
          topology:
            class: builtin-generic-v3.3.0
            version: v1.35.5---vmware.1-vkr.1
            variables:
              - name: vsphereOptions
                value:
                  persistentVolumes:
                    defaultStorageClass: vsan-default-storage-policy
              - name: kubernetes
                value:
                  certificateRotation:
                    enabled: true
                    renewalDaysBeforeExpiry: 90
              - name: vmClass
                value: best-effort-medium
              - name: storageClass
                value: vsan-default-storage-policy
            controlPlane:
              replicas: 1
              metadata:
                annotations:
                  run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu, os-version=24.04, content-library=cl-b37cec53ff29e2cf7
            workers:
              machineDeployments:
                - class: node-pool
                  name: ${to_lower(input.vks_name)}-np
                  replicas: ${input.workerCount}
                  metadata:
                    annotations:
                      run.tanzu.vmware.com/resolve-os-image: os-name=ubuntu, os-version=24.04, content-library=cl-b37cec53ff29e2cf7
      wait:
        conditions:
          - type: Ready
            status: 'True'
  VKS_Bootstrap:
    type: CCI.Supervisor.Resource
    dependsOn:
      - CLUSTER
    createTimeout: 45m
    properties:
      context: ${resource.cciNamespace.id}
      existing: true
      manifest:
        apiVersion: run.tanzu.vmware.com/v1alpha3
        kind: ClusterBootstrap
        metadata:
          name: ${to_lower(input.vks_name)}-${env.shortDeploymentId}
      wait:
        conditions:
          - type: Guest-Cluster-Auth-Service-ReconcileSucceeded
            status: 'True'
            indicatesFailure: false
          - type: Vsphere-Cpi-ReconcileSucceeded
            status: 'True'
            indicatesFailure: false
          - type: Vsphere-Pv-Csi-ReconcileSucceeded
            status: 'True'
            indicatesFailure: false
  dbPassword:
    type: Util.PasswordEntry
    properties:
      length: 16
  VKS_Job:
    type: CCI.Supervisor.Resource
    dependsOn:
      - VKS_Bootstrap
    createTimeout: 60m
    properties:
      context: ${resource.cciNamespace.id}
      manifest:
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: wp-deploy-${env.shortDeploymentId}
        spec:
          completions: 1
          backoffLimit: 0
          ttlSecondsAfterFinished: 1800
          template:
            spec:
              restartPolicy: Never
              containers:
                - name: wp-deploy
                  image: depot.kube-system.svc/hol/kubectl:latest
                  volumeMounts:
                    - name: cluster-kubeconfig-volume
                      mountPath: /etc/vks-kubeconfig
                      readOnly: true
                  command: ['/bin/bash','-c']
                  args:
                    - |
                      set -e
                      export KUBECONFIG=/etc/vks-kubeconfig/vks-cluster-kubeconfig-admin
                      kubectl get nodes
                      kubectl create namespace wordpress --dry-run=client -o yaml | kubectl apply -f -
                      kubectl label namespace wordpress \
                        pod-security.kubernetes.io/enforce=privileged --overwrite
                      cat <<'MANIFEST' | kubectl apply -n wordpress -f -
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: wordpress-db
                        labels: {app: wordpress-db}
                      spec:
                        selector: {matchLabels: {app: wordpress-db}}
                        template:
                          metadata: {labels: {app: wordpress-db}}
                          spec:
                            containers:
                              - name: mariadb
                                image: depot.kube-system.svc/hol/mariadb:latest
                                env:
                                  - {name: MARIADB_ROOT_PASSWORD, value: "${resource.dbPassword.generatedPassword}"}
                                  - {name: MARIADB_DATABASE, value: wordpress}
                                  - {name: MARIADB_USER, value: wordpress}
                                  - {name: MARIADB_PASSWORD, value: "${resource.dbPassword.generatedPassword}"}
                                ports: [{containerPort: 3306}]
                      ---
                      apiVersion: v1
                      kind: Service
                      metadata: {name: wordpress-db}
                      spec:
                        selector: {app: wordpress-db}
                        ports: [{port: 3306, targetPort: 3306}]
                      ---
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: wordpress
                        labels: {app: wordpress}
                      spec:
                        selector: {matchLabels: {app: wordpress}}
                        template:
                          metadata: {labels: {app: wordpress}}
                          spec:
                            # wp-cli comes from the lab registry, NOT the internet.
                            # The pod is air-gapped; this init container lifts the
                            # wp binary out of the mirrored wordpress:cli image so
                            # the installer can run with the WordPress pod's own PHP.
                            initContainers:
                              - name: wp-cli-copy
                                image: depot.kube-system.svc/hol/wp-cli:latest
                                command: ['sh','-c','cp /usr/local/bin/wp /wpcli/wp && chmod 0755 /wpcli/wp']
                                volumeMounts:
                                  - {name: wpcli, mountPath: /wpcli}
                            containers:
                              - name: wordpress
                                image: depot.kube-system.svc/hol/wordpress:latest
                                env:
                                  - {name: WORDPRESS_DB_HOST, value: wordpress-db}
                                  - {name: WORDPRESS_DB_NAME, value: wordpress}
                                  - {name: WORDPRESS_DB_USER, value: wordpress}
                                  - {name: WORDPRESS_DB_PASSWORD, value: "${resource.dbPassword.generatedPassword}"}
                                  # The install Job pins --url=http://localhost (the LB
                                  # address is unknowable at install time), which leaves
                                  # the site unstyled at its real address. Deriving the
                                  # URL from the request host fixes it at any address.
                                  - {name: WORDPRESS_CONFIG_EXTRA, value: "define('WP_HOME','http://'.$_SERVER['HTTP_HOST']); define('WP_SITEURL','http://'.$_SERVER['HTTP_HOST']);"}
                                ports: [{containerPort: 80}]
                                volumeMounts:
                                  - {name: wpcli, mountPath: /wpcli}
                            volumes:
                              - {name: wpcli, emptyDir: {}}
                      ---
                      apiVersion: v1
                      kind: Service
                      metadata: {name: wordpress-lb}
                      spec:
                        selector: {app: wordpress}
                        type: LoadBalancer
                        ports: [{port: 80, targetPort: 80}]
                      MANIFEST
                      kubectl -n wordpress rollout status deploy/wordpress-db --timeout=300s
                      kubectl -n wordpress rollout status deploy/wordpress --timeout=300s
                      # Run the WordPress installer so students land on a real site.
                      # wp is at /wpcli, placed there by the init container from the
                      # mirrored image. No internet fetch, and no "|| true" - if the
                      # install genuinely fails we want the job to fail loudly rather
                      # than leave students on the setup wizard.
                      POD=$(kubectl -n wordpress get pod -l app=wordpress -o jsonpath='{.items[0].metadata.name}')
                      kubectl -n wordpress exec $POD -- bash -c '
                        set -e
                        cd /var/www/html
                        if php /wpcli/wp core is-installed --allow-root 2>/dev/null; then
                          echo "wordpress already installed"
                        else
                          php /wpcli/wp core install --url=http://localhost \
                            --title="${input.siteTitle}" --admin_user=admin \
                            --admin_password="${resource.dbPassword.generatedPassword}" --admin_email=admin@example.com \
                            --allow-root --skip-email
                        fi'
                      echo "WORDPRESS-DEPLOYED"
              volumes:
                - name: cluster-kubeconfig-volume
                  secret:
                    secretName: ${to_lower(input.vks_name)}-${env.shortDeploymentId}-kubeconfig
                    items:
                      - key: value
                        path: vks-cluster-kubeconfig-admin
      wait:
        conditions:
          - type: Complete
            status: 'True'
